<!-- Navbar User Kısmı Güncellemesi -->
<div id="nav-user" class="hidden flex items-center gap-6">
    <div class="flex flex-col items-end">
        <span id="user-display" class="text-xs font-black text-indigo-400"></span>
        <span id="balance-display" class="text-[10px] text-green-500 font-bold">Bakiye: $0.00</span>
    </div>
    <button onclick="logout()" class="bg-red-500/10 text-red-500 p-2 rounded-lg hover:bg-red-500 hover:text-white transition">
        <i class="fa-solid fa-power-off"></i>
    </button>
</div>

<!-- Admin Paneli - Yeni Özellikler -->
<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-10">
    <div class="glass p-6 rounded-3xl border-indigo-500/20">
        <p class="text-xs text-slate-500 uppercase">Toplam Ciro</p>
        <h3 id="admin-revenue" class="text-2xl font-black text-green-400">$0.00</h3>
    </div>
    <div class="glass p-6 rounded-3xl border-indigo-500/20">
        <p class="text-xs text-slate-500 uppercase">Aktif Kullanıcı</p>
        <h3 id="admin-users" class="text-2xl font-black text-blue-400">0</h3>
    </div>
</div>

<script>
    // Oturum Kontrolü (Sayfa Yenilendiğinde Çıkış Yapmaz)
    window.onload = () => {
        const savedUser = localStorage.getItem('simo_user');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            document.getElementById('nav-auth').classList.add('hidden');
            document.getElementById('nav-user').classList.remove('hidden');
            document.getElementById('user-display').innerText = currentUser.email;
            updateBalance();
            showTab(currentUser.role === 'admin' ? 'admin' : 'customer');
        }
    };

    async function login() {
        // Gerçek API sorgusu
        const res = await fetch(`${API}/auth`, {
            method: 'POST',
            body: JSON.stringify({ email, password, action: 'login' })
        });
        
        if(res.ok) {
            const data = await res.json();
            localStorage.setItem('simo_user', JSON.stringify(data.user));
            location.reload(); 
        } else {
            alert("Giriş başarısız! Bilgileri kontrol edin.");
        }
    }

    function logout() {
        localStorage.removeItem('simo_user');
        location.reload();
    }

    // Bakiye Yükleme (Müşteri Paneli)
    function addBalance() {
        const amount = prompt("Yüklemek istediğiniz tutarı girin ($):");
        if(amount) {
            alert(amount + "$ bakiye talebi alındı. Ödeme onayından sonra eklenecektir.");
            // Burada ödeme gateway (Iyzico/Paytr vb.) entegrasyonu başlar.
        }
    }
</script>
