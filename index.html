<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simoq SMS Onay Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; }
        .card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <!-- Başlık -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black italic text-indigo-500 tracking-tighter">SIMOQ <span class="text-white">SMS</span></h1>
            <p class="text-slate-400 text-sm mt-2">Hızlı, Güvenilir, Manuel Onay Sistemi</p>
        </div>

        <!-- Müşteri Bilgilendirme -->
        <div class="card p-4 rounded-2xl mb-6 flex items-center gap-4 border-l-4 border-l-yellow-500">
            <i class="fa-solid fa-circle-info text-yellow-500 text-xl"></i>
            <p class="text-xs text-slate-300">Numarayı satın aldıktan sonra kodu almak için WhatsApp/Telegram üzerinden bize ulaşın.</p>
        </div>

        <!-- Numara Listesi (Burayı Düzenleyeceksin) -->
        <div id="market" class="space-y-4">
            <!-- ÖRNEK NUMARA SATIRI -->
            <div class="card p-5 rounded-3xl flex justify-between items-center hover:scale-[1.02] transition-all">
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <i class="fa-brands fa-whatsapp text-green-500"></i>
                        <span class="text-xs font-bold text-slate-500 uppercase">Fiziksel Hat</span>
                    </div>
                    <h3 class="text-xl font-mono font-bold">+380 63 123 45 67</h3>
                </div>
                <div class="text-right">
                    <p class="text-xl font-black text-green-500 mb-2">50 ₺</p>
                    <a href="https://wa.me/905XXXXXXX?text=Merhaba, +380...67 numaralı hattı almak istiyorum" 
                       class="bg-indigo-600 px-6 py-2 rounded-xl font-bold text-sm hover:bg-indigo-700 transition">
                        SATIN AL
                    </a>
                </div>
            </div>

            <!-- Yeni Numaraları Buraya Kopyala-Yapıştır Yapabilirsin -->
            <div class="card p-5 rounded-3xl flex justify-between items-center opacity-80 border-dashed border-white/20">
                <div class="italic text-slate-500 text-sm">Diğer numaralar yükleniyor...</div>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-12 text-center text-slate-600 text-[10px] uppercase tracking-widest">
            SIMOQ V1.0 - NO DATABASE REQUIRED
        </div>
    </div>

</body>
</html>
