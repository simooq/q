<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMOQ PREMIUM | Global SMS Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { background-color: #050810; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-user-select: none; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .btn-primary { background: linear-gradient(135deg, #2563eb, #7c3aed); transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px #4f46e5; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input { background: rgba(30, 41, 59, 0.5) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; }
        input:focus { border-color: #6366f1 !important; outline: none; }
    </style>
</head>
<body>

    <!-- ÜST NAVİGASYON -->
    <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-white/5">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-white italic">S</div>
            <span class="text-xl font-extrabold tracking-tighter uppercase">Simoq<span class="text-indigo-500">Pro</span></span>
        </div>
        <div id="userInfo" class="hidden flex items-center gap-4">
            <span id="displayEmail" class="text-xs text-slate-400 font-mono"></span>
            <button onclick="location.reload()" class="text-xs bg-white/5 hover:bg-white/10 px-3 py-1 rounded-full transition">Çıkış</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6">

        <!-- 1. GİRİŞ EKRANI (AUTH) -->
        <section id="auth-section" class="tab-content active mt-12">
            <div class="max-w-md mx-auto glass p-10 rounded-[2.5rem] shadow-2xl">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-extrabold mb-2">Hoş Geldiniz</h2>
                    <p class="text-slate-400 text-sm">Devam etmek için hesabınıza giriş yapın</p>
                </div>
                <div class="space-y-4">
                    <div class="relative">
                        <i class="fa-regular fa-envelope absolute left-4 top-4 text-slate-500"></i>
                        <input id="email" type="email" placeholder="E-posta Adresi" class="w-full pl-12 p-4 rounded-2xl">
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-4 text-slate-500"></i>
                        <input id="password" type="password" placeholder="Şifre" class="w-full pl-12 p-4 rounded-2xl">
                    </div>
                    <button onclick="handleAuth()" class="w-full btn-primary py-4 rounded-2xl font-bold text-lg">Giriş Yap</button>
                </div>
            </div>
        </section>

        <!-- 2. MÜŞTERİ PANELİ -->
        <section id="customer-section" class="tab-content mt-8">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-4xl font-black italic">AKTİF HATTINIZI SEÇİN</h2>
                <div class="flex gap-4">
                    <div class="glass px-6 py-3 rounded-2xl text-center">
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest">Bakiye</p>
                        <p class="text-xl font-bold text-green-400">$0.00</p>
                    </div>
                </div>
            </div>
            <div id="numberGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Numaralar Buraya Gelecek -->
            </div>
        </section>

        <!-- 3. ADMIN PANELİ -->
        <section id="admin-section" class="tab-content mt-8">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Sol: İşlem Paneli -->
                <div class="lg:col-span-1 space-y-6">
                    <div class="glass p-8 rounded-[2rem]">
                        <h3 class="text-xl font-bold mb-6 text-indigo-400 underline italic">Yeni Numara Tanımla</h3>
                        <div class="space-y-4">
                            <input id="newPhone" type="text" placeholder="+380XXXXXXXXX" class="w-full p-4 rounded-2xl font-mono">
                            <button onclick="addNumber()" class="w-full bg-indigo-600 hover:bg-indigo-700 py-4 rounded-2xl font-bold transition">Sisteme Aktar</button>
                        </div>
                    </div>
                </div>
                <!-- Sağ: İstatistikler -->
                <div class="lg:col-span-2 glass p-8 rounded-[2rem]">
                    <h3 class="text-xl font-bold mb-6">Sistem İzleme</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-indigo-600/5 p-6 rounded-2xl border border-indigo-500/10">
                            <p class="text-xs text-slate-500">Bekleyen İstekler</p>
                            <p class="text-3xl font-black">0</p>
                        </div>
                        <div class="bg-green-600/5 p-6 rounded-2xl border border-green-500/10">
                            <p class="text-xs text-slate-500">Bugünkü Kazanç</p>
                            <p class="text-3xl font-black text-green-500">$0.00</p>
                        </div>
                    </div>
                    <div class="mt-10 pt-6 border-t border-white/5">
                        <button onclick="alert('Reset Fonksiyonu Tetiklendi')" class="text-xs text-red-500/50 hover:text-red-500 transition uppercase tracking-tighter">Tüm Veritabanını Temizle</button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- SMS KOD MODAL -->
    <div id="smsModal" class="hidden fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-4">
        <div class="glass p-12 rounded-[3rem] max-w-sm w-full text-center border-indigo-500/30">
            <div class="relative w-20 h-20 mx-auto mb-6">
                <div class="absolute inset-0 bg-indigo-500 rounded-full animate-ping opacity-20"></div>
                <div class="relative w-20 h-20 bg-indigo-600 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-comment-sms text-3xl"></i>
                </div>
            </div>
            <p id="modalPhone" class="text-slate-400 font-mono text-sm mb-2"></p>
            <h3 id="modalStatus" class="text-xl font-bold mb-8 italic">SMS BEKLENİYOR...</h3>
            <div id="modalCode" class="text-6xl font-black text-white tracking-widest mb-10">------</div>
            <button onclick="closeModal()" class="w-full bg-slate-800 hover:bg-slate-700 py-4 rounded-2xl font-bold">Pencereyi Kapat</button>
        </div>
    </div>

<script>
    const API = "https://simoq.hasan-antalya98.workers.dev";
    
    // --- GÜVENLİK AYARLARI ---
    const ADMIN_CREDENTIALS = {
        email: "admin@simoq.com",
        pass: "simoq2026",
        token: "GIZLI_ADMIN_SIFRESI_123" // Worker kodundaki token ile aynı olmalı
    };

    function showSection(id) {
        document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active'));
        document.getElementById(id + '-section').classList.add('active');
    }

    function handleAuth() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;

        if(!email || !pass) return alert("Lütfen tüm alanları doldurun.");

        // Navigasyon Güncelle
        document.getElementById('userInfo').classList.remove('hidden');
        document.getElementById('displayEmail').innerText = email;

        // Admin mi Kontrol Et
        if(email === ADMIN_CREDENTIALS.email && pass === ADMIN_CREDENTIALS.pass) {
            showSection('admin');
        } else {
            showSection('customer');
            loadNumbers();
        }
    }

    async function loadNumbers() {
        try {
            const res = await fetch(`${API}/list-numbers`);
            const numbers = await res.json();
            const grid = document.getElementById('numberGrid');
            
            if(numbers.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center glass rounded-[2rem] border-dashed border-white/10 text-slate-500">Şu an aktif numara bulunmuyor.</div>`;
                return;
            }

            grid.innerHTML = numbers.map(n => `
                <div class="glass p-8 rounded-[2.5rem] hover:border-indigo-500/40 transition-all group">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-[10px] bg-indigo-500/20 text-indigo-400 px-3 py-1 rounded-full font-bold uppercase tracking-widest">Ukrayna</span>
                        <div class="w-2 h-2 bg-green-500 rounded-full shadow-[0_0_10px_#22c55e]"></div>
                    </div>
                    <p class="text-2xl font-mono font-black mb-8">${n}</p>
                    <button onclick="buyAndReceive('${n}')" class="w-full btn-primary py-4 rounded-2xl font-bold shadow-lg">NUMARAYI AL ($1.00)</button>
                </div>
            `).join('');
        } catch (e) { console.error("Veri yükleme hatası."); }
    }

    async function addNumber() {
        const phone = document.getElementById('newPhone').value;
        if(!phone) return alert("Numara girin!");

        const res = await fetch(`${API}/admin/add`, {
            method: 'POST',
            body: JSON.stringify({ token: ADMIN_CREDENTIALS.token, phone })
        });

        if(res.ok) {
            alert("Numara başarıyla sisteme eklendi.");
            document.getElementById('newPhone').value = "";
        } else {
            alert("Yetki hatası! Token uyuşmuyor.");
        }
    }

    async function buyAndReceive(phone) {
        if(!confirm(phone + " numarasını kiralamak istiyor musunuz?")) return;

        // Kilitleme İşlemi
        await fetch(`${API}/buy`, { method: 'POST', body: JSON.stringify({ phone }) });

        // Modal Hazırlık
        document.getElementById('smsModal').classList.remove('hidden');
        document.getElementById('modalPhone').innerText = phone;
        document.getElementById('modalCode').innerText = "------";

        // Sorgulama Döngüsü
        const checkSms = setInterval(async () => {
            const res = await fetch(`${API}/get-code?phone=${encodeURIComponent(phone)}`);
            const data = await res.json();
            if(data.success) {
                document.getElementById('modalCode').innerText = data.code;
                document.getElementById('modalStatus').innerText = "KOD ALINDI!";
                document.getElementById('modalStatus').classList.add('text-green-500');
                clearInterval(checkSms);
            }
        }, 5000);
    }

    function closeModal() {
        document.getElementById('smsModal').classList.add('hidden');
        loadNumbers();
    }
</script>
</body>
</html>
