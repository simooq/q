<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Simoq Pro | SMS Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; -webkit-user-select: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body oncontextmenu="return false">

    <nav class="p-4 bg-slate-800 flex justify-center gap-4">
        <button onclick="showTab('customer')" class="bg-blue-600 px-4 py-2 rounded">Müşteri Sayfası</button>
        <button onclick="showTab('admin')" class="bg-red-600 px-4 py-2 rounded">Admin Paneli</button>
    </nav>

    <!-- MÜŞTERİ BÖLÜMÜ -->
    <div id="customer" class="tab-content active p-8">
        <h2 class="text-2xl font-bold mb-4">Mevcut Numaralar</h2>
        <div id="numberGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <!-- Numaralar buraya gelecek -->
        </div>
    </div>

    <!-- ADMIN BÖLÜMÜ -->
    <div id="admin" class="tab-content p-8">
        <div class="max-w-md mx-auto bg-slate-800 p-6 rounded-lg">
            <h2 class="text-xl mb-4 text-red-400">Yeni Numara Ekle</h2>
            <input id="adminToken" type="password" placeholder="Admin Şifresi" class="w-full p-2 mb-2 bg-slate-700 rounded">
            <input id="newPhone" type="text" placeholder="+380XXXXXXXXX" class="w-full p-2 mb-4 bg-slate-700 rounded">
            <button onclick="addNumber()" class="w-full bg-green-600 py-2 rounded">Sisteme Ekle</button>
        </div>
    </div>

<script>
    const API = "https://simoq.hasan-antalya98.workers.dev";

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'customer') loadNumbers();
    }

    // Numaraları Yükle
    async function loadNumbers() {
        const res = await fetch(`${API}/list-numbers`);
        const numbers = await res.json();
        const grid = document.getElementById('numberGrid');
        grid.innerHTML = numbers.map(n => `
            <div class="bg-slate-700 p-4 rounded text-center border border-slate-600">
                <p class="font-mono mb-2">${n}</p>
                <button onclick="buyNumber('${n}')" class="bg-blue-500 text-xs px-2 py-1 rounded">Satın Al</button>
            </div>
        `).join('');
    }

    // Numara Satın Al (2 hafta kilitle)
    async function buyNumber(phone) {
        if(!confirm(phone + " numarasını kiralamak istiyor musunuz?")) return;
        await fetch(`${API}/buy`, {
            method: 'POST',
            body: JSON.stringify({ phone })
        });
        alert("Satın alındı! Numara 2 hafta boyunca listeden kaldırıldı.");
        loadNumbers();
    }

    // Admin: Numara Ekle
    async function addNumber() {
        const token = document.getElementById('adminToken').value;
        const phone = document.getElementById('newPhone').value;
        const res = await fetch(`${API}/admin/add`, {
            method: 'POST',
            body: JSON.stringify({ token, phone })
        });
        if(res.ok) { alert("Başarıyla eklendi!"); loadNumbers(); }
        else { alert("Yetki hatası!"); }
    }

    // İlk yükleme
    loadNumbers();
</script>
</body>
</html>
