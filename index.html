<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMOQ PREMIUM | Otomatik Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700&display=swap');
        body { background-color: #05070a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .neon-text { font-family: 'Orbitron', sans-serif; text-shadow: 0 0 10px #6366f1; }
        .vip-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(15px); border: 1px solid rgba(99, 102, 241, 0.1); transition: all 0.3s; }
        .admin-panel { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; padding: 2rem; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- MÜŞTERİ ARAYÜZÜ -->
    <nav class="p-6 flex justify-between items-center max-w-6xl mx-auto">
        <div class="neon-text text-2xl font-black italic text-indigo-500">SIMOQ<span class="text-white">VIP</span></div>
        <div class="text-[10px] font-bold text-green-500 bg-green-500/10 px-4 py-2 rounded-full border border-green-500/20 animate-pulse">SİSTEM AKTİF</div>
    </nav>

    <header class="text-center py-10">
        <h1 class="text-4xl md:text-6xl font-black mb-2 tracking-tighter italic uppercase">Anlık <span class="text-indigo-500">Stok</span> Paneli</h1>
        <p class="text-slate-500 text-sm">Gerçek fiziksel hatlar üzerinden anında onay kodu teslimatı.</p>
    </header>

    <main id="number-container" class="max-w-5xl mx-auto p-4 grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Numaralar buraya otomatik gelecek -->
    </main>

    <!-- GİZLİ ADMİN PANELİ TETİKLEYİCİ -->
    <footer class="mt-20 text-center">
        <button onclick="toggleAdmin()" class="text-slate-800 text-[9px] hover:text-indigo-500 transition uppercase tracking-widest">Yönetim Girişi</button>
    </footer>

    <!-- ADMİN PANELİ MODAL -->
    <div id="adminPanel" class="admin-panel overflow-y-auto">
        <div class="max-w-2xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-bold text-indigo-400">Panel Yönetimi</h2>
                <button onclick="toggleAdmin()" class="text-white text-2xl">&times;</button>
            </div>
            
            <div class="bg-slate-900 p-6 rounded-3xl border border-indigo-500/30 mb-8">
                <h3 class="mb-4 font-bold">Yeni Numara Ekle</h3>
                <div class="grid gap-4">
                    <input id="adm-phone" type="text" placeholder="Numara (Örn: +380...)" class="bg-black p-4 rounded-xl border border-white/10 outline-none focus:border-indigo-500">
                    <input id="adm-price" type="number" placeholder="Fiyat (TL)" class="bg-black p-4 rounded-xl border border-white/10 outline-none">
                    <button onclick="saveNumber()" class="bg-indigo-600 py-4 rounded-xl font-bold uppercase hover:bg-indigo-700">Sisteme Gönder</button>
                </div>
            </div>

            <div id="admin-list" class="space-y-2">
                <!-- Yönetilecek numaralar burada listelenecek -->
            </div>
        </div>
    </div>

    <script>
        // AYAR: Kendi WhatsApp numaranı buraya yaz (90 ile başla)
        const MY_PHONE = "905XXXXXXXXX"; 

        let inventory = JSON.parse(localStorage.getItem('simo_inventory')) || [];

        // Sayfa yüklendiğinde numaraları bas
        window.onload = renderAll;

        function renderAll() {
            const container = document.getElementById('number-container');
            const adminList = document.getElementById('admin-list');
            
            // Müşteri Görünümü
            if (inventory.length === 0) {
                container.innerHTML = '<p class="col-span-full text-center text-slate-600 italic">Şu an aktif numara bulunmuyor.</p>';
            } else {
                container.innerHTML = inventory.map(item => `
                    <div class="vip-card p-6 rounded-[2rem] flex flex-col justify-between border border-white/5">
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-[10px] text-indigo-400 font-bold uppercase tracking-widest">Onay Bekliyor</span>
                            <i class="fa-brands fa-whatsapp text-2xl text-green-500"></i>
                        </div>
                        <h3 class="text-2xl font-mono font-bold mb-6">${item.phone}</h3>
                        <div class="flex justify-between items-center border-t border-white/5 pt-4">
                            <span class="text-2xl font-black">${item.price} ₺</span>
                            <a href="https://wa.me/${MY_PHONE}?text=Merhaba, ${item.phone} numaralı hattı satın almak istiyorum." 
                               class="bg-indigo-600 px-6 py-2 rounded-xl text-xs font-black hover:bg-white hover:text-black transition uppercase">
                               Satın Al
                            </a>
                        </div>
                    </div>
                `).join('');
            }

            // Admin Listesi
            adminList.innerHTML = inventory.map((item, index) => `
                <div class="bg-black/40 p-4 rounded-xl flex justify-between items-center border border-white/5">
                    <span class="font-mono">${item.phone} - ${item.price}₺</span>
                    <button onclick="deleteNumber(${index})" class="text-red-500 text-xs font-bold uppercase">SİL</button>
                </div>
            `).join('');
        }

        function saveNumber() {
            const phone = document.getElementById('adm-phone').value;
            const price = document.getElementById('adm-price').value;

            if(!phone || !price) return alert("Eksik bilgi!");

            inventory.push({ phone, price });
            localStorage.setItem('simo_inventory', JSON.stringify(inventory));
            
            document.getElementById('adm-phone').value = '';
            document.getElementById('adm-price').value = '';
            
            renderAll();
            alert("Numara başarıyla eklendi!");
        }

        function deleteNumber(index) {
            if(confirm("Silmek istediğine emin misin?")) {
                inventory.splice(index, 1);
                localStorage.setItem('simo_inventory', JSON.stringify(inventory));
                renderAll();
            }
        }

        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        // F12 ve Sağ Tık Koruması
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = e => {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73)) return false;
        };
    </script>
</body>
</html>
