<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMOQ PREMIUM | Güvenli SMS Onay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@300;400;700&display=swap');
        
        body { background-color: #05070a; color: #e2e8f0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .neon-text { font-family: 'Orbitron', sans-serif; text-shadow: 0 0 10px #6366f1, 0 0 20px #6366f1; }
        .vip-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(15px); border: 1px solid rgba(99, 102, 241, 0.2); transition: all 0.3s ease; }
        .vip-card:hover { border-color: #6366f1; transform: translateY(-5px); box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.5); }
        .gradient-bg { background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent); }
    </style>
</head>
<body class="gradient-bg min-h-screen">

    <!-- Header -->
    <nav class="p-6 flex justify-between items-center max-w-6xl mx-auto">
        <div class="neon-text text-2xl font-black italic">SIMOQ<span class="text-white">PRO</span></div>
        <div class="flex items-center gap-2 text-xs font-bold text-green-500 bg-green-500/10 px-4 py-2 rounded-full border border-green-500/20">
            <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span></span>
            SİSTEM AKTİF
        </div>
    </nav>

    <!-- Ana Başlık -->
    <header class="text-center py-12 px-4">
        <h1 class="text-5xl md:text-7xl font-black mb-4 tracking-tighter uppercase italic">Gerçek <span class="text-indigo-500">Fiziksel</span> Hatlar</h1>
        <p class="text-slate-400 max-w-xl mx-auto text-sm md:text-base">Sanal numara değil, gerçek SIM kart onayı. Güvenli ödeme ve anında kod teslimatı ile işinizi riske atmayın.</p>
    </header>

    <!-- Numara Listesi -->
    <main class="max-w-5xl mx-auto p-4 grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- NUMARA KARTI BAŞLANGIÇ -->
        <!-- Burayı kopyalayıp çoğaltabilirsin -->
        <div class="vip-card p-8 rounded-[2.5rem] flex flex-col justify-between">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <p class="text-[10px] font-bold text-indigo-400 tracking-[0.2em] mb-1 uppercase">Bölge: Ukrayna / Kyiv</p>
                    <h3 class="text-3xl font-mono font-bold text-white tracking-widest">+380 63 000 00 00</h3>
                </div>
                <div class="bg-indigo-500/20 p-3 rounded-2xl text-indigo-500">
                    <i class="fa-brands fa-whatsapp text-2xl"></i>
                </div>
            </div>
            <div class="flex justify-between items-end">
                <div>
                    <p class="text-slate-500 text-xs font-bold mb-1">TEK SEFERLİK ONAY</p>
                    <p class="text-3xl font-black text-white">75 <span class="text-sm text-slate-400">₺</span></p>
                </div>
                <!-- BURAYA KENDİ WHATSAPP LİNKİNİ EKLE -->
                <a href="https://wa.me/905XXXXXXX?text=Merhaba, +3800000000 numarayı almak istiyorum" class="bg-white text-black px-8 py-3 rounded-2xl font-black text-xs hover:bg-indigo-500 hover:text-white transition-all uppercase">
                    Satın Al
                </a>
            </div>
        </div>
        <!-- NUMARA KARTI BİTİŞ -->

    </main>

    <!-- Güven Verici Footer -->
    <footer class="mt-20 border-t border-white/5 p-10 text-center">
        <div class="flex justify-center gap-10 mb-8 opacity-40 grayscale">
            <i class="fa-brands fa-cc-visa text-3xl"></i>
            <i class="fa-brands fa-cc-mastercard text-3xl"></i>
            <i class="fa-brands fa-bitcoin text-3xl"></i>
        </div>
        <p class="text-slate-600 text-[10px] uppercase font-bold tracking-widest">© 2026 SIMOQ NETWORK - ALL RIGHTS RESERVED</p>
    </footer>

    <!-- GÜVENLİK SCRIPTİ (F12 ve Sağ Tık Engeli) -->
    <script>
        // Sağ tık engeli
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Klavye kısayolları engeli
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false; // F12
            if (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0))) return false;
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U (Kaynak kodu)
        };

        // Console temizleme ve uyarı (Opsiyonel)
        setInterval(() => {
            console.clear();
            console.log("%cBURASI GÜVENLİ ALANDIR!", "color:red; font-size:30px; font-weight:bold;");
        }, 1000);
    </script>
</body>
</html>
